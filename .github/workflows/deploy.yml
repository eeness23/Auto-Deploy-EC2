name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Xmx512m -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN'

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          .m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Run Tests
      run: mvn clean test
      
    - name: Build Application
      run: mvn clean package -DskipTests
      
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-jar
        path: target/*.jar
        retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: spring-boot-jar
        path: target/
        
    - name: Create Deployment Package
      run: |
        mkdir -p deployment-package
        cp target/*.jar deployment-package/
        cp deploy-scripts/deploy.sh deployment-package/
        chmod +x deployment-package/deploy.sh
        
    - name: Deploy to EC2
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.EC2_HOST }}
        REMOTE_USER: ${{ secrets.EC2_USER }}
        SOURCE: "deployment-package/"
        TARGET: "/opt/myapp/"
        EXCLUDE: "/node_modules/, /.git/, /.github/"
        SCRIPT_AFTER: |
          cd /opt/myapp
          chmod +x deploy.sh
          sudo ./deploy.sh
